<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Executivo N1 → N2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      min-height: 100vh;
    }

    /* ===== Barra lateral ===== */
    .sidebar {
      width: 180px;
      background: #1e293b;
      padding: 24px 16px;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 20px;
      padding-left: 8px;
    }
    .period-btn {
      display: block;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: #94a3b8;
      font-size: 0.95rem;
      transition: all 0.2s;
      background: transparent;
    }
    .period-btn:hover {
      background: #334155;
      color: #e2e8f0;
    }
    .period-btn.active {
      background: #4f46e5;
      color: white;
      font-weight: 500;
    }

    /* ===== Conteúdo principal ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 16px 24px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .badge {
      background: #4f46e5;
      color: white;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 999px;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <!-- Barra lateral de períodos -->
  <aside class="sidebar">
    <h2>Período</h2>
    <a href="dashboard_executivo_01-2026.html" class="period-btn" data-month="01/2026">01/2026</a>
    <a href="dashboard_executivo_02-2026.html" class="period-btn" data-month="02/2026">02/2026</a>
    <a href="dashboard_executivo_03-2026.html" class="period-btn" data-month="03/2026">03/2026</a>
    <a href="dashboard_executivo_04-2026.html" class="period-btn" data-month="04/2026">04/2026</a>
    <a href="dashboard_executivo_05-2026.html" class="period-btn" data-month="05/2026">05/2026</a>
    <a href="dashboard_executivo_06-2026.html" class="period-btn" data-month="06/2026">06/2026</a>
    <a href="dashboard_executivo_07-2026.html" class="period-btn" data-month="07/2026">07/2026</a>
    <a href="dashboard_executivo_08-2026.html" class="period-btn" data-month="08/2026">08/2026</a>
	<a href="dashboard_executivo_09-2026.html" class="period-btn" data-month="09/2026">09/2026</a>
    <a href="dashboard_executivo_10-2026.html" class="period-btn" data-month="10/2026">10/2026</a>
    <a href="dashboard_executivo_11-2026.html" class="period-btn" data-month="11/2026">11/2026</a>
    <a href="dashboard_executivo_12-2026.html" class="period-btn" data-month="12/2026">12/2026</a>
  </aside>

  <!-- Área principal -->
  <div class="main">
    <header class="header">
      <div class="header-title">
        <h1>Relatório Executivo N1 → N2</h1>
        <span class="badge" id="current-month">08/2026</span>
      </div>
    </header>

    <!-- Aqui o dashboard escolhido é carregado -->
    <iframe id="dashboard-frame" src="dashboard_executivo_08-2026.html"></iframe>
  </div>

  <script>
    // Destaca o botão clicado e atualiza o iframe + badge
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();

        // Remove active de todos
        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
        // Ativa o clicado
        this.classList.add('active');

        // Atualiza o iframe
        document.getElementById('dashboard-frame').src = this.getAttribute('href');

        // Atualiza o badge do mês
        document.getElementById('current-month').textContent = this.dataset.month;
      });
    });
  </script>
</body>
</html>
